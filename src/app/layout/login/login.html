<div class="page-wrapper">

  <div class="blueprint-grid"></div>
  <div class="studio-lens lens-a"></div>
  <div class="studio-lens lens-b"></div>
 

  <div class="login-card">
    <img src="onlyLogo.png" alt="Logo" class="logo" height="100" width="100">

    <div class="brand-name">
      <span class="ubic">UBI</span><span class="sms">CSMS</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <!-- <app-text-input
          label="Email"
          placeholder="Enter Email"
          formControlName="username"
          autocomplete="username">
        </app-text-input> -->
        <label for="email">EMAIL</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="email"
            placeholder="Enter Email"
            formControlName="username"
            autocomplete="username">
        </div>
        @if (loginForm.get('username')?.invalid && loginForm.get('username')?.touched) {
          <span class="field-error">Email is required.</span>
        }
      </div>

      <div class="form-group">
        <label for="password">ENTER PASSWORD</label>
        <div class="input-wrapper">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            id="password"
            placeholder="Enter Password"
            formControlName="password"
            autocomplete="current-password">
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            aria-label="Toggle password visibility"
            tabindex="-1">
            @if (showPassword()) {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            }
          </button>
        </div>
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <span class="field-error">Password is required.</span>
        }
      </div>

      @if (errorMessage()) {
        <div class="form-error">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn-submit" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
        } @else {
          SIGN IN
        }
      </button>

    </form>
  </div>

</div>
