<div class="flex h-screen bg-white font-sans text-slate-800 antialiased overflow-hidden">

  <!-- Left Sidebar (persistent on desktop, slide-in overlay drawer on mobile/tablet) -->
  <app-sidebar
    [activeNav]="activeNav"
    [mobileOpen]="mobileMenuOpen"
    (navChange)="onNavChange($event)"
    (closeMobile)="closeMobileMenu()"
  ></app-sidebar>

  <!-- Right Main Area -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden bg-white">

    <!-- Top Navbar -->
    <app-navbar
      [searchQuery]="searchQuery"
      (searchChange)="onSearchChange($event)"
      (menuToggle)="toggleMobileMenu()"
    ></app-navbar>

    <!-- Page Content View -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-gray-100 rounded-tl-2xl">
      <div class="max-w-10xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>

  <!-- Global Live WebRTC/SSE Incoming Call Popup Modal — suppressed on the
       softphone page itself, which already has its own full call UI. -->
  <app-global-call-popup *ngIf="!isSoftphonePage"></app-global-call-popup>

</div>
