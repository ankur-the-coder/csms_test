<div class="relative b py-4 h-full rounded-lg
            w-full
            bg-white text-basic  shadow-sm flex flex-col "
            [ngClass]="leaveChart ? 'px-4' : 'px-3'">

         
          
    <div class=" flex  w-full ">
     
      <div 
        class="flex flex-nowrap mb-4 w-full justify-between items-center
        bg-component text-basic 
        relative  chart-dropdown"
        
      >
        <!-- Chart Type Dropdown (Left Side) -->
        <div class="relative" (clickOutside)="onClickOutside()">
          <button
            type="button"
            (click)="toggleDropdown()"
            class="max-w-18 h-8 border px-0.5   border-gray-300  
            bg-component text-basic 
             rounded-lg  flex items-center justify-between "
          >
            <div  
            class="flex items-center  px-0.5   
           ">
              @if(selectedChart){<div
              class="w-5/6  text-basic "
                [innerHTML]="getSanitizedIcon(selectedChart.value)"
                
              ></div>}
            </div>
            <svg  
              class="w-4 h-2  text-basic
            "
              [class.transform]="isDropdownOpen"
              [class.rotate-180]="isDropdownOpen"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 16"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              ></path>
            </svg>
          </button>

          @if(isDropdownOpen){
            <div class="absolute top-12 left-0 z-10 mt-1 rounded-md">
              <div class="flex flex-col pb-3 pt-2 bg-white rounded-lg dark:bg-white/10 text-basic border border-white/40 dark:border-white/10 shadow-lg">
                @for (type of getFilteredChartTypes(); track type.value) {
                  <button
                    (click)="selectChart(type)"
                    class="py-1.5 px-3 flex items-center gap-2 hover:bg-white/40 dark:hover:bg-white/10 hover:text-black focus:outline-none group transition-colors"
                    [class.bg-white/50]="selectedChart?.value === type.value"
                    [class.text-black]="selectedChart?.value === type.value"
                  >
                    <div 
                      [innerHTML]="getSanitizedIcon(type.value)"
                      class="w-6 h-5 text-basic group-hover:text-black" 
                      [class.text-black]="selectedChart?.value === type.value"
                    ></div>
                    <span class="min-w-fit text-sm">
                      {{ type.label }}
                    </span>
                  </button>
                }
              </div>
            </div>
          }
        </div>

        <!-- Export Dropdown (Right Side) -->
        <div class="relative" (clickOutside)="onExportClickOutside()">
          <button
            type="button"
            (click)="toggleExportDropdown()"
            class="max-w-18 h-8 border px-0.5 border-gray-300  
            bg-component text-basic 
             rounded-lg  flex items-center justify-between "
          >
            <div class="flex items-center px-0.5">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2 2z"/>
                <path d="M8 21v-4a2 2 0 012-2h4a2 2 0 012 2v4"/>
                <path d="M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"/>
              </svg>
            </div>
            <svg  
            class="w-4 h-2 text-basic"
            [class.transform]="isExportDropdownOpen"
            [class.rotate-180]="isExportDropdownOpen"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 16"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            ></path>
          </svg>
          </button>

          @if(isExportDropdownOpen){
            <div class="absolute top-12 right-0 z-10 mt-1 rounded-md">
              <div class="flex flex-col pb-3 pt-2 bg-white rounded-lg dark:bg-white/10 text-basic border border-white/40 dark:border-white/10 shadow-lg min-w-48">
                
                <button
                  (click)="viewFullScreen()"
                  class="py-2 px-3 flex items-center gap-3 hover:bg-white/40 dark:hover:bg-white/10 hover:text-black focus:outline-none text-left transition-colors"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
                  </svg>
                  <span class="text-sm">View in full screen</span>
                </button>

                <button
                  (click)="printChart()"
                  class="py-2 px-3 flex items-center gap-3 hover:bg-white/40 dark:hover:bg-white/10 hover:text-black focus:outline-none text-left transition-colors"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6,9 6,2 18,2 18,9"/>
                    <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
                    <rect x="6" y="14" width="12" height="8"/>
                  </svg>
                  <span class="text-sm">Print chart</span>
                </button>

                <button
                  (click)="downloadImage('png')"
                  class="py-2 px-3 flex items-center gap-3 hover:bg-white/40 dark:hover:bg-white/10 hover:text-black focus:outline-none text-left transition-colors"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7,10 12,15 17,10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  <span class="text-sm">Download PNG</span>
                </button>

                <button
                  (click)="downloadImage('jpeg')"
                  class="py-2 px-3 flex items-center gap-3 hover:bg-white/40 dark:hover:bg-white/10 hover:text-black focus:outline-none text-left transition-colors"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7,10 12,15 17,10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  <span class="text-sm">Download JPEG</span>
                </button>

                <button
                  (click)="downloadPDF()"
                  class="py-2 px-3 flex items-center gap-3 hover:bg-white/40 dark:hover:bg-white/10 hover:text-black focus:outline-none text-left transition-colors"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14,2 14,8 20,8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10,9 9,9 8,9"/>
                  </svg>
                  <span class="text-sm">Download PDF</span>
                </button>

                <button
                  (click)="downloadSVG()"
                  class="py-2 px-3 flex items-center gap-3 hover:bg-white/40 dark:hover:bg-white/10 hover:text-black focus:outline-none text-left transition-colors"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7,10 12,15 17,10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  <span class="text-sm">Download SVG </span>
                </button>

                <button
                  (click)="downloadCSV()"
                  class="py-2 px-3 flex items-center gap-3 hover:bg-white/40 dark:hover:bg-white/10 hover:text-black focus:outline-none text-left transition-colors"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14,2 14,8 20,8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10,9 9,9 8,9"/>
                  </svg>
                  <span class="text-sm">Download CSV</span>
                </button>

                <button
                  (click)="downloadExcel()"
                  class="py-2 px-3 flex items-center gap-3 hover:bg-white/40 dark:hover:bg-white/10 hover:text-black focus:outline-none text-left transition-colors"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14,2 14,8 20,8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10,9 9,9 8,9"/>
                  </svg>
                  <span class="text-sm">Download XLS</span>
                </button>

              </div>
            </div>
          }
        </div>
      </div>
    </div>
    <!-- @if(leaveChart) {<h3 class="w-full text-center mt-4 font-semibold">
      <span [innerHTML]="headingText"></span>
    </h3>} -->
     
    <div class=" w-full h-70 " (click)="viewFullScreen()">
      <canvas class="block w-full h-full rounded-md" [id]="chartId"></canvas>

  </div>
     @if(leaveChart){<h3 class="ps-1 pe-3 w-full text-center font-semibold py-1">

            </h3>
         }
