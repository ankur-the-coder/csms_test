<div class="relative py-4 h-full rounded-2xl w-full bg-white text-slate-800 shadow-sm flex flex-col border border-slate-100"
  [ngClass]="leaveChart ? 'px-4' : 'px-3'">

  <div class="flex w-full">
    <div
      class="flex flex-nowrap mb-4 w-full justify-between items-center bg-white text-slate-800 relative z-20 chart-dropdown">
      <!-- Chart Type Dropdown (Left Side) -->
      <div class="relative" (clickOutside)="onClickOutside()">
        <button
          type="button"
          (click)="toggleDropdown()"
          class="min-w-14 h-8 px-2 border border-slate-300 bg-white text-slate-700 rounded-lg flex items-center justify-between gap-1.5 shadow-xs hover:border-slate-400 hover:bg-slate-50 transition cursor-pointer"
        >
          <div class="flex items-center text-slate-800">
            @if(selectedChart){
              <div class="w-4.5 h-4.5 flex items-center justify-center text-slate-800"
                [innerHTML]="getSanitizedIcon(selectedChart.value)"></div>
            }
          </div>
          <svg
            class="w-3.5 h-3.5 text-slate-600 transition-transform duration-200"
            [class.rotate-180]="isDropdownOpen"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            ></path>
          </svg>
        </button>

        @if(isDropdownOpen){
          <div class="absolute top-full left-0 z-50 mt-1 min-w-[165px] rounded-xl bg-white text-slate-800 border border-slate-200 shadow-xl py-1.5 overflow-hidden">
            @for (type of getFilteredChartTypes(); track type.value) {
              <button
                type="button"
                (click)="selectChart(type)"
                class="w-full py-2 px-3 flex items-center gap-2.5 hover:bg-slate-50 focus:outline-none transition-colors text-left cursor-pointer"
                [class.bg-[#bbf7d0]]="selectedChart?.value === type.value"
                [class.hover:bg-[#bbf7d0]]="selectedChart?.value === type.value"
                [class.font-semibold]="selectedChart?.value === type.value"
              >
                <div 
                  [innerHTML]="getSanitizedIcon(type.value)"
                  class="w-5 h-5 shrink-0 flex items-center justify-center text-slate-800"
                ></div>
                <span class="text-xs font-medium whitespace-nowrap text-slate-800">
                  {{ type.label }}
                </span>
              </button>
            }
          </div>
        }
      </div>

      <!-- Export Dropdown (Right Side) -->
      <div class="relative" (clickOutside)="onExportClickOutside()">
        <button
          type="button"
          (click)="toggleExportDropdown()"
          class="min-w-14 h-8 px-2 border border-slate-300 bg-white text-slate-700 rounded-lg flex items-center justify-between gap-1.5 shadow-xs hover:border-slate-400 hover:bg-slate-50 transition cursor-pointer"
        >
          <div class="flex items-center text-slate-800">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-700">
              <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2 2z"/>
              <path d="M8 21v-4a2 2 0 012-2h4a2 2 0 012 2v4"/>
              <path d="M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"/>
            </svg>
          </div>
          <svg  
            class="w-3.5 h-3.5 text-slate-600 transition-transform duration-200"
            [class.rotate-180]="isExportDropdownOpen"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            ></path>
          </svg>
        </button>

        @if(isExportDropdownOpen){
          <div class="absolute top-full right-0 z-50 mt-1 min-w-48 rounded-xl bg-white text-slate-800 border border-slate-200 shadow-xl py-1.5 overflow-hidden">
            
            <button
              type="button"
              (click)="viewFullScreen()"
              class="w-full py-2 px-3 flex items-center gap-3 hover:bg-slate-50 focus:outline-none text-left transition-colors cursor-pointer text-slate-800"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-700">
                <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
              </svg>
              <span class="text-xs font-medium">View in full screen</span>
            </button>

            <button
              type="button"
              (click)="printChart()"
              class="w-full py-2 px-3 flex items-center gap-3 hover:bg-slate-50 focus:outline-none text-left transition-colors cursor-pointer text-slate-800"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-700">
                <polyline points="6,9 6,2 18,2 18,9"/>
                <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
                <rect x="6" y="14" width="12" height="8"/>
              </svg>
              <span class="text-xs font-medium">Print chart</span>
            </button>

            <button
              type="button"
              (click)="downloadImage('png')"
              class="w-full py-2 px-3 flex items-center gap-3 hover:bg-slate-50 focus:outline-none text-left transition-colors cursor-pointer text-slate-800"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-700">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7,10 12,15 17,10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span class="text-xs font-medium">Download PNG</span>
            </button>

            <button
              type="button"
              (click)="downloadImage('jpeg')"
              class="w-full py-2 px-3 flex items-center gap-3 hover:bg-slate-50 focus:outline-none text-left transition-colors cursor-pointer text-slate-800"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-700">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7,10 12,15 17,10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span class="text-xs font-medium">Download JPEG</span>
            </button>

            <button
              type="button"
              (click)="downloadPDF()"
              class="w-full py-2 px-3 flex items-center gap-3 hover:bg-slate-50 focus:outline-none text-left transition-colors cursor-pointer text-slate-800"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-700">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14,2 14,8 20,8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10,9 9,9 8,9"/>
              </svg>
              <span class="text-xs font-medium">Download PDF</span>
            </button>

            <button
              type="button"
              (click)="downloadSVG()"
              class="w-full py-2 px-3 flex items-center gap-3 hover:bg-slate-50 focus:outline-none text-left transition-colors cursor-pointer text-slate-800"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-700">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7,10 12,15 17,10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span class="text-xs font-medium">Download SVG</span>
            </button>

            <button
              type="button"
              (click)="downloadCSV()"
              class="w-full py-2 px-3 flex items-center gap-3 hover:bg-slate-50 focus:outline-none text-left transition-colors cursor-pointer text-slate-800"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-700">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14,2 14,8 20,8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10,9 9,9 8,9"/>
              </svg>
              <span class="text-xs font-medium">Download CSV</span>
            </button>

            <button
              type="button"
              (click)="downloadExcel()"
              class="w-full py-2 px-3 flex items-center gap-3 hover:bg-slate-50 focus:outline-none text-left transition-colors cursor-pointer text-slate-800"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-700">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14,2 14,8 20,8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10,9 9,9 8,9"/>
              </svg>
              <span class="text-xs font-medium">Download XLS</span>
            </button>

          </div>
        }
      </div>
    </div>
  </div>
   
  <div #chartContainer class="relative w-full h-[280px] min-h-[280px] flex-1 z-0" (click)="viewFullScreen()">
    <canvas #chartCanvas class="block w-full h-full rounded-md" [id]="chartId"></canvas>
  </div>
<hr class="my-3 border-slate-200" *ngIf="leaveChart">
  @if(leaveChart){
    <h3 class="ps-1 pe-3 w-full text-center font-semibold py-1 text-slate-800">
      <span [innerHTML]="headingText"></span>
    </h3>
  }
</div>
