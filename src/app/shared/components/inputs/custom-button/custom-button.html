<button [type]="type() || 'button'" [class]="classes()" [disabled]="disabled() || loading()"
    [attr.aria-disabled]="disabled() || loading()" [attr.aria-busy]="loading()" [attr.data-loading]="loading()"
    [attr.data-variant]="variant()" role="button" (click)="handleClick($event)">

    <!--  LOADING SPINNER -->
    @if (loading()) {
    <span class="absolute inset-0 flex items-center justify-center">
        <span class="animate-spin inline-flex" aria-hidden="true">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
        </span>
    </span>
    }

    <!--  CONTENT -->
    <div class="flex items-center justify-center gap-2 w-full" [class.invisible]="loading()">

        <!-- LEFT ICON -->
        <!-- <span class="flex items-center justify-center shrink-0 [&_svg]:size-[1em]">
            <ng-content select="[icon-left]" />
        </span> -->

        <!-- LABEL -->
        <span class="flex items-center justify-center">
            @if (label()) {
            {{ label() }}
            } @else {
            <ng-content />
            }
        </span>

    </div>

    <!--  RIPPLE -->
    @if (ripple()) {
    <span class="absolute rounded-full bg-white/40 pointer-events-none animate-[ping_0.4s_linear]"
        [style.width.px]="ripple()?.size" [style.height.px]="ripple()?.size" [style.left.px]="ripple()?.x"
        [style.top.px]="ripple()?.y"></span>
    }

</button>
