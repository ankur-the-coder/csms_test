<div class="scrim" [class.show]="open" (click)="closed.emit()"></div>

<aside class="side" [class.open]="open">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <img [src]="orgLogo && !logoFailed ? orgLogo : fallbackLogo" (error)="logoFailed = true" alt="" />
    </span>
    <span class="brand-text">
      <strong><span class="b-ubi">ubi</span><span class="b-client">Client</span></strong>
      <small>{{ orgName || 'Your workspace' }}</small>
    </span>
    <button class="x" type="button" (click)="closed.emit()" aria-label="Close menu"><p-icon name="close" [size]="18" /></button>
  </div>

  <nav class="nav" aria-label="Client portal">
    @for (item of nav; track item.id; let i = $index) {
      @if (item.route) {
        <a class="item" [routerLink]="item.route" routerLinkActive="active" (click)="closed.emit()" [style.--i]="i">
          <span class="ico"><p-icon [name]="item.icon" [size]="19" /></span>
          <span class="lbl">{{ item.label }}</span>
        </a>
      } @else {
        <button class="item soon" type="button" (click)="nudge(item)" [style.--i]="i" [attr.title]="'Coming soon'">
          <span class="ico"><p-icon [name]="item.icon" [size]="19" /></span>
          <span class="lbl">{{ item.label }}</span>
          <span class="chip" [class.pop]="soonId === item.id">Soon</span>
        </button>
      }
    }
  </nav>

  <div class="foot">
    <span class="me" [attr.title]="userName" aria-hidden="true">{{ initial }}</span>
    <button type="button" class="out" (click)="logout()"><p-icon name="logout" [size]="16" /> Sign out</button>
  </div>
</aside>
