<div class="rte-toolbar">
    <button type="button" (click)="toggleBold()" [class.active]="isActive('bold')" title="Bold">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round">
            <path d="M6 4h8a4 4 0 0 1 0 8H6z" />
            <path d="M6 12h9a4 4 0 0 1 0 8H6z" />
        </svg>
    </button>
    <button type="button" (click)="toggleItalic()" [class.active]="isActive('italic')" title="Italic">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round">
            <line x1="19" y1="4" x2="10" y2="4" />
            <line x1="14" y1="20" x2="5" y2="20" />
            <line x1="15" y1="4" x2="9" y2="20" />
        </svg>
    </button>
    <button type="button" (click)="toggleUnderline()" [class.active]="isActive('underline')" title="Underline">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round">
            <path d="M6 3v7a6 6 0 0 0 12 0V3" />
            <line x1="4" y1="21" x2="20" y2="21" />
        </svg>
    </button>
    <button type="button" (click)="toggleStrike()" [class.active]="isActive('strike')" title="Strikethrough">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round">
            <line x1="4" y1="12" x2="20" y2="12" />
            <path d="M16 6.5C15.5 5 13.8 4 12 4c-2.2 0-4 1.3-4 3s1.8 2.7 4 3" />
            <path d="M8 17.5c.5 1.5 2.2 2.5 4 2.5c2.2 0 4-1.3 4-3" />
        </svg>
    </button>
    <span class="rte-divider"></span>
    <button type="button" (click)="toggleBulletList()" [class.active]="isActive('bulletList')" title="Bullet list">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round">
            <line x1="9" y1="6" x2="20" y2="6" />
            <line x1="9" y1="12" x2="20" y2="12" />
            <line x1="9" y1="18" x2="20" y2="18" />
            <circle cx="4.5" cy="6" r="1" />
            <circle cx="4.5" cy="12" r="1" />
            <circle cx="4.5" cy="18" r="1" />
        </svg>
    </button>
    <button type="button" (click)="toggleOrderedList()" [class.active]="isActive('orderedList')" title="Numbered list">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round">
            <line x1="10" y1="6" x2="20" y2="6" />
            <line x1="10" y1="12" x2="20" y2="12" />
            <line x1="10" y1="18" x2="20" y2="18" />
            <path d="M4 6h1v4" />
            <path d="M4 18v-1h2v1l-2 2h2" />
        </svg>
    </button>
    <span class="rte-divider"></span>
    <button type="button" (click)="openLinkModal()" [class.active]="isActive('link')" title="Insert / Edit Link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round">
            <path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.5 1.5" />
            <path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.5-1.5" />
        </svg>
    </button>
    <button type="button" (click)="toggleBlockquote()" [class.active]="isActive('blockquote')" title="Quote">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round">
            <path d="M7 8c-2 0-3 1.5-3 3.5S5 15 7 15v4" />
            <path d="M17 8c-2 0-3 1.5-3 3.5S15 15 17 15v4" />
        </svg>
    </button>
    <span class="rte-spacer"></span>
    <button type="button" (click)="undo()" title="Undo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14l-4-4 4-4" />
            <path d="M5 10h9a5 5 0 0 1 0 10h-1" />
        </svg>
    </button>
    <button type="button" (click)="redo()" title="Redo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 14l4-4-4-4" />
            <path d="M19 10h-9a5 5 0 0 0 0 10h1" />
        </svg>
    </button>
</div>
<div #editorEl class="rte-content"></div>

<!-- ── Modern Link Dialog Modal ── -->
@if (isLinkModalOpen) {
<div class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4"
  (click)="closeLinkModal()">
  <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl border border-slate-100 overflow-hidden transform transition-all"
    (click)="$event.stopPropagation()"
    (keydown.escape)="closeLinkModal()">

    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 bg-slate-50/70">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center border border-emerald-100">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.5 1.5" />
            <path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.5-1.5" />
          </svg>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-slate-800">
            {{ isEditingExistingLink ? 'Edit Link' : 'Insert Link' }}
          </h3>
          <p class="text-[11px] text-slate-400">Add a clickable hyperlink to your message</p>
        </div>
      </div>
      <button type="button" (click)="closeLinkModal()"
        class="w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-200/60 hover:text-slate-600 transition">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18 6 6 18" />
          <path d="M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="p-5 space-y-4">
      <!-- Link URL -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">
          Destination URL <span class="text-emerald-500">*</span>
        </label>
        <div class="relative flex items-center rounded-xl border border-slate-200 shadow-sm focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-100 transition-all bg-white overflow-hidden">
          <span class="pl-3 pr-2 text-slate-400 flex items-center pointer-events-none">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="2" y1="12" x2="22" y2="12" />
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            </svg>
          </span>
          <input #linkInput type="url" [(ngModel)]="linkUrl"
            (keydown.enter)="applyLink()"
            placeholder="https://example.com"
            class="w-full py-2.5 pr-3 text-sm text-slate-800 placeholder:text-slate-400 outline-none border-none bg-transparent" />
        </div>
      </div>

      <!-- Text to display -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">
          Display Text <span class="text-slate-400 font-normal">(Optional)</span>
        </label>
        <input type="text" [(ngModel)]="linkText"
          (keydown.enter)="applyLink()"
          placeholder="Text to display"
          class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 shadow-sm focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition-all" />
      </div>

      <!-- Open in new tab checkbox -->
      <label class="flex items-center gap-2.5 cursor-pointer select-none pt-1">
        <input type="checkbox" [(ngModel)]="openInNewTab"
          class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-slate-300 accent-emerald-600" />
        <span class="text-xs font-medium text-slate-600">Open in a new window/tab</span>
      </label>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between px-5 py-3.5 border-t border-slate-100 bg-slate-50/50">
      <div>
        @if (isEditingExistingLink) {
        <button type="button" (click)="removeLink()"
          class="px-3 py-1.5 text-xs font-medium text-rose-600 hover:bg-rose-50 rounded-lg transition-colors flex items-center gap-1.5">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
          Remove link
        </button>
        }
      </div>
      <div class="flex items-center gap-2">
        <button type="button" (click)="closeLinkModal()"
          class="px-3.5 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200 transition">
          Cancel
        </button>
        <button type="button" (click)="applyLink()" [disabled]="!linkUrl.trim()"
          class="px-4 py-1.5 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg shadow-xs transition flex items-center gap-1.5">
          <span>{{ isEditingExistingLink ? 'Update' : 'Insert' }}</span>
        </button>
      </div>
    </div>

  </div>
</div>
}
