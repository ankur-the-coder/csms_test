<div class="space-y-6 pb-12">
  <div class="card p-4 mb-4">
    <h1 class="text-xl font-bold">Feedback</h1>
    <p class="mt-2 text-sm text-text-muted">
      <!-- Manage all client information, agreements, contacts, subscriptions in one place -->
    </p>
  </div>

  <div class="card p-0 overflow-hidden">
    <app-data-table [config]="tableConfig()" (onRefresh)="loadData()" [filterNames]="['leadOwner', 'supportOwner']"
      [initialDateFrom]="initialDateFrom()" [initialDateTo]="initialDateTo()">
      <ng-template appCustomColumn="rating" let-value="value" let-row="row">
        <div class="inline-flex items-center gap-0.5 px-3 py-1.5 rounded-full
           bg-yellow-50 text-yellow-400 text-[16px]">
          <ng-container *ngFor="let star of [1, 2, 3, 4, 5]">
            <span>
              {{ star <= row.rating ? '★' : '☆' }} </span>
          </ng-container>
        </div>
      </ng-template>
