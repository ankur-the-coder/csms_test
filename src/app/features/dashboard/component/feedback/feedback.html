
<div class="space-y-6 pb-12">
  <!-- =========================================================
       DASHBOARD HEADER
       ========================================================= -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4
           bg-white p-6 rounded-2xl border border-slate-200/90 shadow-xs">
    <div>
      <h1 class="text-xl font-bold text-text-primary">
        Feedback
      </h1>
    </div>

    <div class="w-full md:w-64 lg:w-64">
      <app-custom-date-selector [defaultPreset]="'currentMonth'" (onApplyDate)="onDateApplied($event.from, $event.to)">
      </app-custom-date-selector>
    </div>
  </div>

  <!-- =========================================================
       RATING CARDS (1–6 STARS) — flat style
       ========================================================= -->
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">
  @for (rating of ratingCards(); track rating.stars; let first = $first) {
  <div (click)="navigateToRating(rating.stars)"

    class="group cursor-pointer rounded-2xl border bg-white p-4 sm:p-5  border-emerald-500  transition-all duration-300 hover:-translate-y-1 hover:shadow-lg">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <p class="text-xs sm:text-sm font-medium text-slate-500 truncate">
          @if (rating.stars === 6) {
            Total
          } @else {
            {{ rating.stars }} Star{{ rating.stars > 1 ? 's' : '' }}
          }
        </p>

        <p class="mt-1 sm:mt-2 text-2xl sm:text-3xl font-bold text-slate-900">
          {{ rating.count }}
        </p>
      </div>

      <div [ngClass]="rating.colorClasses.iconBg"
        class="flex h-9 w-9 sm:h-10 sm:w-10 shrink-0 items-center justify-center rounded-full transition-transform duration-300 group-hover:scale-110">
        @if (rating.stars === 6) {
          <!-- distinct icon for the Total card -->
          <svg class="h-4 w-4 sm:h-5 sm:w-5" [ngClass]="rating.colorClasses.iconColor" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 17V9m3 8V5m3 12v-5M5 21h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2z" />
          </svg>
        } @else {
          <svg class="h-4 w-4 sm:h-5 sm:w-5" [ngClass]="rating.colorClasses.iconColor" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2l2.9 6.26 6.9.6-5.2 4.53
                   1.56 6.76L12 16.9 5.84 20.15
                   7.4 13.39 2.2 8.86l6.9-.6L12 2z" />
          </svg>
        }
      </div>
    </div>
  </div>
  }
</div>

  <div class="card p-0 overflow-hidden">
    <app-data-table [config]="tableConfig()" (onRefresh)="loadData()" [filterNames]="['leadOwner', 'supportOwner']"
      [initialDateFrom]="initialDateFrom()" [initialDateTo]="initialDateTo()">
      <ng-template appCustomColumn="rating" let-value="value" let-row="row">
        <div class="inline-flex items-center gap-0.5 px-3 py-1.5 rounded-full bg-yellow-50 text-yellow-400 text-[16px]">
          <ng-container *ngFor="let star of [1, 2, 3, 4, 5]">
            <span> {{ star <= row.rating ? '★' : '☆' }} </span>
          </ng-container>
        </div>
      </ng-template>
    </app-data-table>
  </div>
</div>
