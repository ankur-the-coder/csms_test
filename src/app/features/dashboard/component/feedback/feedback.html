<div class="space-y-6 pb-12">
  <div class="card p-4 mb-4">
    <h1 class="text-xl font-bold">Feedback</h1>
    <p class="mt-2 text-sm text-text-muted">
      <!-- Manage all client information, agreements, contacts, subscriptions in one place -->
    </p>
  </div>
<!-- =========================================================
       SUMMARY CARDS
       ========================================================= -->

  <!-- =========================================================
       RATING CARDS (1–5 STARS)
       ========================================================= -->
  <!-- =========================================================
       RATING CARDS (1–5 STARS)
       ========================================================= -->

  <div class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-5 gap-4">

    @for (rating of ratingCards(); track rating.stars) {
      <div
        (click)="navigateToRating(rating.stars)"
        [ngClass]="rating.colorClasses.card"
        class="group cursor-pointer rounded-2xl border p-5
               transition-all duration-300
               hover:-translate-y-1 hover:shadow-lg"
      >
        <div class="flex items-start justify-between">

          <div>
            <p class="text-sm font-medium text-slate-500">
              {{ rating.stars }} Star{{ rating.stars > 1 ? 's' : '' }}
            </p>

            <p class="mt-2 text-3xl font-bold text-slate-900">
              {{ rating.count }}
            </p>
          </div>

          <div
            [ngClass]="rating.colorClasses.icon"
            class="flex h-10 w-10 items-center justify-center rounded-xl
                   transition-transform duration-300
                   group-hover:scale-110"
          >
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M12 2l2.9 6.26 6.9.6-5.2 4.53
                   1.56 6.76L12 16.9 5.84 20.15
                   7.4 13.39 2.2 8.86l6.9-.6L12 2z"
              />
            </svg>
          </div>

        </div>

        <!-- Star row -->
        <div class="mt-3 flex gap-0.5">
          @for (i of [1,2,3,4,5]; track i) {
            <svg
              class="h-4 w-4"
              [class.text-slate-200]="i > rating.stars"
              [ngClass]="i <= rating.stars ? rating.colorClasses.star : ''"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M12 2l2.9 6.26 6.9.6-5.2 4.53
                   1.56 6.76L12 16.9 5.84 20.15
                   7.4 13.39 2.2 8.86l6.9-.6L12 2z"
              />
            </svg>
          }
        </div>
      </div>
    }

  </div>
  <div class="card p-0 overflow-hidden">
    <app-data-table [config]="tableConfig()" (onRefresh)="loadData()" [filterNames]="['leadOwner', 'supportOwner']"
      [initialDateFrom]="initialDateFrom()" [initialDateTo]="initialDateTo()">
      <ng-template appCustomColumn="rating" let-value="value" let-row="row">
        <div class="inline-flex items-center gap-0.5 px-3 py-1.5 rounded-full
           bg-yellow-50 text-yellow-400 text-[16px]">
          <ng-container *ngFor="let star of [1, 2, 3, 4, 5]">
            <span>
              {{ star <= row.rating ? '★' : '☆' }} </span>
          </ng-container>
        </div>
      </ng-template>
