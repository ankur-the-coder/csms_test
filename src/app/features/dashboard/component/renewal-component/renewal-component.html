<div class="space-y-6 pb-12">
  <div class="card p-4 mb-4">
    <h1 class="text-xl font-bold">Renewed Clients</h1>
    <!-- <p class="mt-2 text-sm text-text-muted"> -->
      <!-- Manage all Renewable Plan client information, agreements, contacts, subscriptions in one place -->
    <!-- </p> -->
  </div>

  <div class="card p-0 overflow-hidden">
    <app-data-table
      [config]="tableConfig()"
      (onRefresh)="loadData()"
      [initialDateFrom]="initialDateFrom()"
      [initialDateTo]="initialDateTo()"
      [disableFutureDates]="true"
      [filterNames]="['leadOwner', 'supportOwner']"
    >
      <ng-template appCustomColumn="renewCount" let-value="value" let-row="row">
        <div

          (click)="goToClientDashboard(row)"
          class="px-4 py-1.5 rounded-full  text-blue-600 text-[13px] font-medium cursor-pointer hover:text-blue-600 "
        >
          {{ row.renewCount }}
        </div>
      </ng-template>
    </app-data-table>
  </div>
</div>
