      </div>

      <!-- Trends, Health Distribution & Daily Ops (3 Columns, uneven widths) -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Implementation Progress & Trends (Shared Chart Component) -->
        <div class="lg:col-span-5">
          <app-charts
            type="trend"
            title="Implementation Progress & Trends"
            actionText="Open Tracker"
            (actionClick)="navigateToImplementation()"
          ></app-charts>
        </div>

        <!-- Health Score Distribution Donut Widget (Shared Chart Component) -->
        <div class="lg:col-span-4">
          <app-charts
            type="donut"
            title="Health Score Distribution"
            [totalCount]="256"
            totalLabel="Total Clients"
            [healthSegments]="healthSegments"
          ></app-charts>
        </div>

        <!-- Daily Tasks & Operations -->
        <div class="lg:col-span-3 bg-white rounded-2xl p-6 border border-slate-200/90 shadow-xs flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-5">
              <h3 class="text-base font-extrabold text-slate-900 tracking-tight">Daily Tasks & Operations</h3>
              <span class="text-xs text-slate-400 font-medium">54 Total Tasks</span>
            </div>

            <div class="space-y-3.5">
              @for (op of dailyOps; track op.label) {
                <div>
                  <div class="flex items-center justify-between text-xs font-bold mb-1">
                    <span class="text-slate-700">{{ op.label }}</span>
                    <span [ngClass]="op.danger ? 'text-rose-600' : 'text-slate-900'">{{ op.value }}</span>
                  </div>
                  <div class="w-full h-2 rounded-full bg-slate-100/90 overflow-hidden">
                    <div
                      class="h-full rounded-full transition-all duration-500"
                      [style.width.%]="op.pct"
                      [ngClass]="op.barClass"
                    ></div>
                  </div>
                </div>
              }
            </div>
          </div>
        </div>

      </div>

      <!-- Shared Custom Calendar Component -->
      <app-calendar [eventsByDay]="eventsByDay"></app-calendar>

    </div>
