<div class="space-y-6 pb-12">
  <!-- ── Page Header ──────────────────────────────────────────────────────── -->


  <div class="card p-4 mb-4">
    <h1 class="text-xl font-bold">Onboarding Dashboard</h1>
    <p class="mt-2 text-sm text-text-muted">
      Every onboarding in progress. Switch views, filter, and act on bottlenecks.
    </p>
  </div>
 <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

    <!-- Total Accounts -->
    <div class="card flex items-center justify-between gap-4">
      <div>
        <span class="text-xs font-semibold text-text-muted uppercase tracking-wider">Total Onboardings</span>
        <div class="text-2xl font-extrabold text-text-primary mt-1">{{ totalClients() }}</div>
        <!-- <div class="text-xs font-medium text-text-muted mt-1">Active CS Portfolio</div> -->
      </div>
      <div
        class="h-12 w-12 rounded-xl bg-brand-50 text-brand-500 flex items-center justify-center border border-brand-100 flex-shrink-0">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
    </div>

    <!-- Completed -->
    <div class="card flex items-center justify-between gap-4">
      <div>
        <span class="text-xs font-semibold text-text-muted uppercase tracking-wider">In Progress</span>
        <div class="text-2xl font-extrabold text-brand-500 mt-1">{{ completedClientsCount() }}</div>
        <!-- <div class="text-xs font-medium text-brand-500 mt-1">100% Approved</div> -->
      </div>
      <div
        class="h-12 w-12 rounded-xl bg-brand-50 text-brand-500 flex items-center justify-center border border-brand-100 flex-shrink-0">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
    </div>

    <!-- In Progress -->
    <div class="card flex items-center justify-between gap-4">
      <div>
        <span class="text-xs font-semibold text-text-muted uppercase tracking-wider">On Track</span>
        <div class="text-2xl font-extrabold text-amber-600 mt-1">{{ inProgressClientsCount() }}</div>
        <!-- <div class="text-xs font-medium text-amber-600 mt-1">Active Milestones</div> -->
      </div>
      <div
        class="h-12 w-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center border border-amber-100 flex-shrink-0">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
    </div>

    <!-- Not Started -->
    <div class="card flex items-center justify-between gap-4">
      <div>
        <span class="text-xs font-semibold text-text-muted uppercase tracking-wider">Completed </span>
        <div class="text-2xl font-extrabold text-text-muted mt-1">{{ pendingClientsCount() }}</div>
        <!-- <div class="text-xs font-medium text-text-muted mt-1">Pending Kickoff</div> -->
      </div>
      <div
        class="h-12 w-12 rounded-xl bg-surface-100 text-text-muted flex items-center justify-center border border-surface-200 flex-shrink-0">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
        </svg>
      </div>
    </div>

  </div>



  <!-- ── TABLE VIEW ─────────────────────────────────────────────────────────── -->

  <div class="card p-0 overflow-hidden">
    <app-data-table [config]="tableConfig()" (onRefresh)="loadData()" [filterNames]="['leadOwner', 'supportOwner']">
    </app-data-table>
  </div>
</div>
