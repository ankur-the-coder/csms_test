<div class="space-y-6 pb-12">
  <div class="card p-4 mb-4">
    <h1 class="text-xl font-bold">Client</h1>
    <p class="mt-2 text-sm text-text-muted">
      Manage all client information, agreements, contacts, subscriptions in one place
    </p>
  </div>

  <div class="card p-0 overflow-hidden">
    <app-data-table
      [config]="tableConfig()"
      (onRefresh)="loadData()"
      [filterNames]="['leadOwner', 'supportOwner']"
      [initialDateFrom]="initialDateFrom()"
      [initialDateTo]="initialDateTo()"
    >
      <ng-template appCustomColumn="progress" let-value="value" let-row="row">
        <div class="flex flex-col gap-1.5 min-w-35">
          <div class="flex items-center gap-2">
            <span class="text-[13px] font-bold text-emerald-600 tabular-nums">{{ value }}%</span>
            <span class="text-[11px] text-slate-400 font-medium"
              >{{ row.approvedCount }}{{ row.totalCount }}
            </span>
          </div>
          <div class="h-2 rounded-full bg-slate-200 overflow-hidden w-full">
            <div
              class="h-full rounded-full bg-emerald-500 transition-all duration-300"
              [style.width.%]="value"
            ></div>
          </div>
        </div>
      </ng-template>

      <ng-template appCustomColumn="trainingStatus" let-value="value">
  @if (value === 1) {
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-700">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
      Completed
    </span>
  } @else if (value === 2) {
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-700">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
      In Progress
    </span>
  } @else if (value === 3) {
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-600">
      <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
      Not Started
    </span>
  } @else {
    <span class="text-[11px] text-slate-400">—</span>
  }
</ng-template>


    </app-data-table>
  </div>
</div>
