<div class="flex h-screen bg-slate-50 font-sans text-slate-800 antialiased overflow-hidden">

    <!-- ───────────────────────────────────────────
         MOBILE: Hamburger button (top-left)
         ─────────────────────────────────────────── -->
    @if (!isLargeScreen()) {
    <div class="fixed  z-40 h-17 w-full flex items-center justify-center
           bg-white shadow-md border border-slate-200 
            hover:bg-slate-100 transition-colors">
        <button (click)="openDrawer()" aria-label="Open navigation menu" class="fixed top-4 left-4 z-40 h-10 w-10 flex items-center justify-center
           bg-white shadow-sm border border-slate-200 rounded-lg
           text-slate-600 hover:text-emerald-700 hover:bg-slate-100 transition-colors duration-200 focus:outline-none">
            <!-- Hamburger icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </div>
    }

    <!-- ───────────────────────────────────────────
         MOBILE: Drawer backdrop
         ─────────────────────────────────────────── -->
    @if (!isLargeScreen() && drawerOpen()) {
    <div class="fixed inset-0 bg-black/40 z-40 backdrop-blur-sm" (click)="closeDrawer()" aria-hidden="true"></div>
    }

    <!-- ───────────────────────────────────────────
         SIDEBAR (drawer on mobile, persistent on desktop)
         ─────────────────────────────────────────── -->
    <aside
        class="h-screen bg-white flex flex-col border-r border-slate-200 shadow-md z-50 shrink-0 transition-all duration-300 ease-in-out w-64"
        [class.fixed]="!isLargeScreen()" [class.relative]="isLargeScreen()"
        [class.-translate-x-full]="!isLargeScreen() && !drawerOpen()"
        [class.translate-x-0]="isLargeScreen() || drawerOpen()">

        <!-- Header: Logo + Close (mobile) -->
        <div class="flex items-center justify-between px-4 py-4 border-b border-slate-100">
            <div class="flex items-center gap-3 cursor-pointer" (click)="navigateHome()">
                <img src="onlyLogo.png" alt="Ubitech logo" width="36" height="36" class="rounded-lg shrink-0" />
                <span class="font-extrabold text-base text-slate-800 whitespace-nowrap">
                    Ubi<span class="text-emerald-600">Client</span>
                </span>
            </div>
            <!-- Close button on mobile -->
            @if (!isLargeScreen()) {
            <button (click)="closeDrawer()" aria-label="Close navigation menu" class="h-8 w-8 flex items-center justify-center rounded-full
                           text-slate-400 hover:text-slate-700 hover:bg-slate-100
                           transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-emerald-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            }
        </div>

        <!-- Nav -->
        <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1">

            <!-- Section label -->
            <div class="px-2 mb-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                User Side
            </div>

            @for (item of navItems; track item.id) {
            <a [routerLink]="item.route" [queryParams]="queryParams()" (click)="closeDrawer()"
                routerLinkActive="bg-emerald-50 text-emerald-700 font-semibold"
                [routerLinkActiveOptions]="{ exact: item.id === 'courses' }" [attr.aria-label]="item.label" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium
                      text-slate-600 transition-all duration-150 cursor-pointer no-underline
                      hover:bg-slate-100 hover:text-slate-900">
                <span class="w-5 h-5 flex items-center justify-center shrink-0 text-slate-500"
                    [innerHTML]="getSvgIcon(item.icon)"></span>
                <span class="whitespace-nowrap">{{ item.label }}</span>
            </a>
            }
        </div>
    </aside>

    <!-- Main content -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden" [class.pl-0]="!isLargeScreen()">
        <main class="flex-1 overflow-y-auto" [class.pt-16]="!isLargeScreen()">
            <router-outlet></router-outlet>
        </main>
    </div>

</div>
