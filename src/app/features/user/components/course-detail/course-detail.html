<!-- ─── Page wrapper ─────────────────────────────────────── -->
<div class="min-h-screen bg-slate-50">

  <!-- ── Shimmer skeleton (loading) ────────────────────────────────────── -->
  <div *ngIf="loading" class="animate-pulse">
    <!-- Top bar skeleton -->
    <div class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
      <div class="h-4 w-28 rounded bg-slate-200"></div>
      <div class="flex items-center gap-3">
        <div class="space-y-1">
          <div class="h-3 w-16 rounded bg-slate-200"></div>
          <div class="h-5 w-48 rounded bg-slate-200"></div>
        </div>
        <div class="h-14 w-14 rounded-full bg-slate-200 shrink-0"></div>
      </div>
    </div>
    <!-- Body skeleton -->
    <div class="flex" style="min-height: calc(100vh - 73px)">
      <!-- Left panel -->
      <div class="w-72 shrink-0 bg-white border-r border-slate-200 p-4 space-y-3">
        <div class="h-3 w-24 rounded bg-slate-200 mb-4"></div>
        <div *ngFor="let _ of [1,2,3,4,5]"
             class="flex items-center gap-3 py-2">
          <div class="h-7 w-7 rounded-full bg-slate-200 shrink-0"></div>
          <div class="h-4 flex-1 rounded bg-slate-100"></div>
        </div>
      </div>
      <!-- Right panel -->
      <div class="flex-1 flex flex-col">
        <div class="bg-black aspect-video w-full bg-slate-900"></div>
        <div class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
          <div class="space-y-1">
            <div class="h-3 w-20 rounded bg-slate-200"></div>
            <div class="h-4 w-56 rounded bg-slate-200"></div>
          </div>
          <div class="h-8 w-32 rounded-lg bg-slate-200"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Error state ────────────────────────────────────────────────────── -->
  <div *ngIf="!loading && error"
       class="flex flex-col items-center justify-center h-screen text-center">
    <div class="h-14 w-14 rounded-full bg-red-50 flex items-center justify-center mb-4">
      <svg class="w-7 h-7 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <p class="text-sm font-semibold text-slate-700">{{ error }}</p>
    <button (click)="backToCatalog()"
            class="mt-4 text-xs font-bold text-emerald-600 hover:text-emerald-700 underline">
      Back to catalog
    </button>
  </div>

  <!-- ── Main content ───────────────────────────────────────────────────── -->
  <div *ngIf="!loading && !error && course" class="flex flex-col h-full">

    <!-- Top bar -->
    <div class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between gap-4">
      <button
        (click)="backToCatalog()"
        class="flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-emerald-600
               transition-colors group"
      >
        <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform" fill="none"
             stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back to catalog
      </button>

      <div class="flex items-center gap-3 min-w-0">
        <div class="min-w-0">
          <p class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">
            {{ 'CRS-' + course.id.toString().padStart(3, '0') }}
            &middot; {{ course.modules.length }} modules
          </p>
          <h1 class="text-base font-extrabold text-slate-800 truncate">{{ course.title }}</h1>
        </div>
        <app-circular-progress [percent]="progressPercent" [size]="56" class="shrink-0"></app-circular-progress>
      </div>
    </div>

    <!-- Body: two-column layout -->
    <div class="flex flex-1 overflow-hidden" style="min-height: calc(100vh - 73px)">

      <!-- Module list (left panel) -->
      <div class="w-72 shrink-0 bg-white border-r border-slate-200 flex flex-col overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wide">Course modules</p>
        </div>
        <div class="flex-1 overflow-y-auto py-2">
          <button
            *ngFor="let module of course.modules; let i = index"
            (click)="selectModule(module)"
            class="w-full flex items-center gap-3 px-4 py-3 text-left transition-colors border-l-[3px]"
            [ngClass]="{
              'bg-emerald-50 border-emerald-500': activeModule?.id === module.id,
              'border-transparent hover:bg-slate-50': activeModule?.id !== module.id
            }"
          >
            <!-- Index or checkmark -->
            <div class="shrink-0 h-7 w-7 rounded-full flex items-center justify-center text-xs font-bold"
                 [ngClass]="{
                   'bg-emerald-500 text-white': module.is_completed,
                   'bg-emerald-100 text-emerald-700': !module.is_completed && activeModule?.id === module.id,
                   'bg-slate-100 text-slate-500': !module.is_completed && activeModule?.id !== module.id
                 }">
              <ng-container *ngIf="module.is_completed">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                </svg>
              </ng-container>
              <ng-container *ngIf="!module.is_completed">
                {{ (i + 1).toString().padStart(2, '0') }}
              </ng-container>
            </div>

            <!-- Title -->
            <span class="text-xs font-semibold line-clamp-2 leading-snug"
                  [ngClass]="{
                    'text-emerald-700': activeModule?.id === module.id,
                    'text-slate-700': activeModule?.id !== module.id
                  }">
              {{ module.title }}
            </span>
          </button>
        </div>
      </div>

      <!-- Player panel (right) -->
      <div class="flex-1 overflow-y-auto bg-slate-50 flex flex-col" *ngIf="activeModule">

        <!-- Video area -->
        <div class="bg-black aspect-video w-full relative">
          <iframe
            *ngIf="safeVideoUrl"
            [src]="safeVideoUrl"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            class="absolute inset-0 w-full h-full"
          ></iframe>
          <div *ngIf="!safeVideoUrl"
               class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 gap-3">
            <svg class="w-12 h-12 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="text-sm font-medium opacity-60">No video for this module</span>
          </div>
        </div>

        <!-- Module meta bar -->
        <div class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between gap-4">
          <div>
            <p class="text-xs text-slate-400 font-medium">Now playing</p>
            <p class="text-sm font-bold text-slate-800">{{ activeModule.title }}</p>
          </div>
          <div class="flex items-center gap-3">
            <span *ngIf="activeModule.is_completed"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold
                         bg-emerald-50 text-emerald-700 border border-emerald-200">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
              </svg>
              Completed
            </span>
            <button
              *ngIf="!activeModule.is_completed"
              (click)="markComplete(activeModule)"
              class="flex items-center gap-1.5 text-xs font-bold px-4 py-2 rounded-lg
                     bg-emerald-600 text-white hover:bg-emerald-700 active:scale-95 transition-all"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
              </svg>
              Mark as complete
            </button>
          </div>
        </div>

        <!-- Module materials -->
        <div *ngIf="activeModule.materials && activeModule.materials.length" class="px-6 py-5">
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-3">Module materials</h4>
          <div class="flex flex-wrap gap-2">
            <a
              *ngFor="let mat of activeModule.materials"
              [href]="mat.file_url || mat.file_path"
              target="_blank"
              class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-200
                     bg-white text-xs font-semibold text-slate-700 hover:border-emerald-400
                     hover:text-emerald-700 transition-colors shadow-sm"
            >
              <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              {{ mat.title }}
            </a>
          </div>
        </div>

        <!-- Course-level materials -->
        <div *ngIf="course.materials && course.materials.length" class="px-6 pb-6">
          <div class="border-t border-slate-200 pt-5">
            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-3">Course resources</h4>
            <div class="flex flex-wrap gap-2">
              <a
                *ngFor="let mat of course.materials"
                [href]="mat.file_url || mat.file_path"
                target="_blank"
                class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-200
                       bg-white text-xs font-semibold text-slate-700 hover:border-emerald-400
                       hover:text-emerald-700 transition-colors shadow-sm"
              >
                <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                {{ mat.title }}
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
