<div class="min-h-screen bg-gray-50/50 p-6 font-sans">

  <!-- My Trainings Section -->
  <div class="max-w-7xl mx-auto">
    <!-- Section Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-bold text-gray-900">My Trainings Center</h2>
      <p class="text-sm text-gray-500">
        Logged in Organisation: <span class="font-semibold text-gray-700">{{ organisation }}</span>
      </p>
    </div>

    <!-- Trainings Table -->
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-gray-100 bg-gray-50/50">
              <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Training Name
              </th>
              <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Trainer
              </th>
              <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Date & Time
              </th>
              <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Mode
              </th>
              <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Status
              </th>
              <th class="text-center px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Actions
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let training of trainings" 
                class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">
              
              <!-- Training Name -->
              <td class="px-6 py-4">
                <div>
                  <div class="font-semibold text-gray-900">{{ training.name }}</div>
                  <div class="text-xs text-gray-500 mt-0.5">{{ training.description }}</div>
                </div>
              </td>

              <!-- Trainer -->
              <td class="px-6 py-4 text-gray-700 font-medium">
                {{ training.trainer }}
              </td>

              <!-- Date & Time -->
              <td class="px-6 py-4">
                <div class="text-gray-900 font-medium">{{ training.date }}</div>
                <div class="text-xs text-gray-500 mt-0.5">{{ training.time }}</div>
              </td>

              <!-- Mode -->
              <td class="px-6 py-4">
                <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium
                             bg-gray-100 text-gray-700 border border-gray-200">
                  {{ training.mode }}
                </span>
              </td>

              <!-- Status -->
              <td class="px-6 py-4">
                <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold border"
                      [class]="getStatusBadgeClass(training.status)">
                  {{ training.status }}
                </span>
              </td>

              <!-- Actions -->
              <td class="px-6 py-4">
                <div class="flex items-center justify-center gap-2">
                  <button
                    (click)="joinSession(training)"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold 
                           px-4 py-2 rounded-lg transition-colors duration-200 flex items-center gap-1.5 shadow-sm cursor-pointer">
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                      <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" />
                    </svg>
                    Join Session
                  </button>
                  <button
                    (click)="viewMaterials(training)"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold 
                           px-4 py-2 rounded-lg transition-colors duration-200 border border-gray-200 cursor-pointer">
                    Materials
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div *ngIf="trainings.length === 0" class="text-center py-12 text-gray-400">
        <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        <p class="text-sm">No trainings found.</p>
      </div>
    </div>
  </div>
</div>
