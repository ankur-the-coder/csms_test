<div class="min-h-screen bg-gray-50/50 p-6 font-sans">

  <!-- Trainer Management Section -->
  <div class="max-w-7xl mx-auto">
    <!-- Section Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-bold text-gray-900">Trainer Management</h2>
      <button
        (click)="addTrainer()"
        class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-5 py-2.5 
               rounded-lg transition-colors duration-200 flex items-center gap-2 shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Add Trainer
      </button>
    </div>

    <!-- Trainers Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
      <!-- Trainer Card -->
      <div *ngFor="let trainer of trainers" 
           class="bg-white rounded-xl border-2 border-gray-100 hover:border-teal-200 
                  transition-all duration-300 p-5 group">
        
        <!-- Card Header -->
        <div class="flex items-start justify-between mb-4">
          <div class="flex items-center gap-3">
            <div [class]="trainer.avatarColor" 
                 class="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-sm">
              {{ trainer.avatar }}
            </div>
            <div>
              <h3 class="font-bold text-gray-900">{{ trainer.name }}</h3>
              <p class="text-xs text-gray-500 flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                {{ trainer.email }}
              </p>
            </div>
          </div>
          
          <!-- Action Buttons -->
          <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
            <button (click)="editTrainer(trainer)"
                    class="p-1.5 text-gray-400 hover:text-teal-600 hover:bg-teal-50 rounded-lg transition-colors cursor-pointer"
                    title="Edit">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
              </svg>
            </button>
            <button (click)="deleteTrainer(trainer.id)"
                    class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors cursor-pointer"
                    title="Delete">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Description -->
        <p class="text-sm text-gray-600 mb-4 italic">"{{ trainer.description }}"</p>

        <!-- Skills Tags -->
        <div class="flex flex-wrap gap-2 mb-4">
          <span *ngFor="let skill of trainer.skills"
                class="px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-medium 
                       rounded-md transition-colors cursor-default">
            {{ skill }}
          </span>
        </div>

        <!-- Workload Capacity -->
        <div class="mb-4">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-gray-500">Workload Capacity</span>
            <span [class]="getCapacityTextColor(trainer.workloadCapacity)" 
                  class="text-xs font-bold">
              {{ trainer.workloadCapacity }}%
            </span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
            <div [class]="getCapacityColor(trainer.workloadCapacity)"
                 [style.width.%]="trainer.workloadCapacity"
                 class="h-full rounded-full transition-all duration-500 ease-out">
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-gray-100">
          <div class="text-center">
            <div class="text-lg font-bold text-gray-900">{{ trainer.assigned }}</div>
            <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Assigned</div>
          </div>
          <div class="text-center border-l border-gray-100">
            <div class="flex items-center justify-center gap-1">
              <svg class="w-4 h-4 text-yellow-400 fill-current" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
              </svg>
              <span class="text-lg font-bold text-gray-900">{{ trainer.rating }}</span>
            </div>
            <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Rating</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
