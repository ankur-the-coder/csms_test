<div class="space-y-6 pb-6">
  <div class="card p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h2 class="text-xl font-bold text-text-primary">Trainer Management</h2>
      <p class="mt-1 text-sm text-text-muted">Review trainer availability, expertise, and workload.</p>
    </div>
    <button
      (click)="addTrainer()"
      class="inline-flex items-center gap-2 rounded-xl bg-brand-500 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-brand-600"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Add Trainer
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
    <div *ngFor="let trainer of trainers" class="card transition-all duration-200 hover:shadow-lg group">
      <div class="mb-4 flex items-start justify-between">
        <div class="flex items-center gap-3">
          <div [class]="trainer.avatarColor" class="flex h-12 w-12 items-center justify-center rounded-full text-sm font-bold text-white">
            {{ trainer.avatar }}
          </div>
          <div>
            <h3 class="font-semibold text-text-primary">{{ trainer.name }}</h3>
            <p class="mt-1 flex items-center gap-1 text-xs text-text-muted">
              <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              {{ trainer.email }}
            </p>
          </div>
        </div>

        <div class="flex gap-1 opacity-0 transition-opacity duration-200 group-hover:opacity-100">
          <button (click)="editTrainer(trainer)" class="rounded-lg p-1.5 text-text-muted transition-colors hover:bg-brand-50 hover:text-brand-600" title="Edit">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
          </button>
          <button (click)="deleteTrainer(trainer.id)" class="rounded-lg p-1.5 text-text-muted transition-colors hover:bg-red-50 hover:text-red-600" title="Delete">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>
      </div>

      <p class="mb-4 text-sm text-text-secondary italic">"{{ trainer.description }}"</p>

      <div class="mb-4 flex flex-wrap gap-2">
        <span *ngFor="let skill of trainer.skills" class="rounded-md border border-card-border bg-surface-100 px-3 py-1 text-xs font-medium text-text-secondary">
          {{ skill }}
        </span>
      </div>

      <div class="mb-4">
        <div class="mb-2 flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-text-muted">Workload Capacity</span>
          <span [class]="getCapacityTextColor(trainer.workloadCapacity)" class="text-xs font-bold">
            {{ trainer.workloadCapacity }}%
          </span>
        </div>
        <div class="h-2 overflow-hidden rounded-full bg-surface-200">
          <div [class]="getCapacityColor(trainer.workloadCapacity)" [style.width.%]="trainer.workloadCapacity" class="h-full rounded-full transition-all duration-500 ease-out"></div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 border-t border-card-border pt-4">
        <div class="text-center">
          <div class="text-lg font-bold text-text-primary">{{ trainer.assigned }}</div>
          <div class="text-[10px] font-semibold uppercase tracking-wider text-text-muted">Assigned</div>
        </div>
        <div class="border-l border-card-border text-center">
          <div class="flex items-center justify-center gap-1">
            <svg class="h-4 w-4 fill-current text-amber-400" viewBox="0 0 20 20">
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
            </svg>
            <span class="text-lg font-bold text-text-primary">{{ trainer.rating }}</span>
          </div>
          <div class="text-[10px] font-semibold uppercase tracking-wider text-text-muted">Rating</div>
        </div>
      </div>
    </div>
  </div>
</div>
